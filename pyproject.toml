[project]
name = "dc-radar"
version = "0.1.0"
description = "Data Center Early Warning Radar: public-record collectors, scoring and review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.11.0",
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pillow>=10.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pypdfium2>=4.30",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs the local Supabase Postgres (supabase db start)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101", # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
