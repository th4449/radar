  - id: mi_michigan_advance_roundup
    state: MI
    name: Michigan Advance weekly data center roundup
    url: https://michiganadvance.com/?p=108625
    layer: baseline
    method: manual
    intended_method: manual
    cadence: weekly
    robots_status: not_checked
