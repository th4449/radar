# One entry per feed. See BUILD_PLAN.md section 6.
#
# method           http, browser or manual. It stays manual until the source's terms of use and
#                  robots rules have been read and written up in docs/sources/<id>.md.
# intended_method  what we expect to use once the source is verified. A plan, not a permission.
# robots_status    not_checked, allowed, restricted or blocked.
# verified_at      date the source note was written. A scheduled job must not fetch a source
#                  while this is null.
# layer            signal (feeds site scores), context (regional only), baseline (known sites)
#                  or lookup (queried per entity).

sources:
  # Texas. All statewide and filtered to the 30 counties after collection.
  - id: tx_public_notices
    state: TX
    name: Texas newspaper public notices, including 30 day tax abatement notices
    url: https://www.texaspublicnotices.com
    layer: signal
    method: manual
    intended_method: manual
    cadence: daily
    robots_status: restricted
    verified_at: 2026-11-19
    notes: The site's terms forbid automated collection and forbid putting its content in any database or archive, with liquidated damages. No collector. Needs the owner's decision. See docs/sources/tx_public_notices.md.

  - id: tx_tceq_air_pending
    state: TX
    name: TCEQ pending air permit applications in the Permit Search Portal
    url: https://permit-search.tceq.texas.gov/
    layer: signal
    method: manual
    intended_method: browser
    cadence: daily
    robots_status: allowed
    verified_at: 2026-11-19
    notes: The live feed since August 31, 2026. Read in a browser. No login, no terms of its own and no robots rules. The footer links to the TCEQ web policies, which call site content public domain. Data comes from POST calls on the same host. Manual until the owner picks a method and fixtures are saved. See docs/sources/tx_tceq_air_pending.md.

  - id: tx_tceq_air_pending_legacy
    state: TX
    name: TCEQ pending air permit lists on the older site
    url: https://www.tceq.texas.gov/permitting/air/airpermit-applications-notices
    layer: signal
    method: http
    intended_method: http
    cadence: weekly
    robots_status: allowed
    verified_at: 2026-11-20
    personal_rows: true
    notes: Two pages. The New Source Review list holds applications complete before August 31, 2026 and serves the backtest. The Title V list is still updated. The application files they link are not fetched. Some applicants are people, so rows need a check before anything is published. See docs/sources/tx_tceq_air_pending_legacy.md.

  - id: tx_tceq_stormwater_noi
    state: TX
    name: TCEQ construction stormwater notices of intent
    url: https://cdn.fs.pathlms.com/1dL9jIAmRK2KniXfbkzs?dl=true
    layer: signal
    method: manual
    intended_method: manual
    cadence: weekly
    robots_status: blocked
    verified_at: 2026-11-19
    notes: robots.txt on www2.tceq.texas.gov closes every path to every crawler. Manual only. The URL is the TCEQ training deck that describes the search. See docs/sources/tx_tceq_stormwater_noi.md.

  - id: tx_ercot_rpg
    state: TX
    name: ERCOT Regional Planning Group project files
    url: https://www.ercot.com/committees/other/rpg
    layer: signal
    method: http
    intended_method: http
    cadence: weekly
    robots_status: allowed
    verified_at: 2026-11-19
    notes: Robots rules allow the index, meeting pages and /files/docs/. Terms allow reuse and prohibit harming site performance. Stay out of /meetings, /widgets and /ical. The collector reads the index, the meetings near today and their files. Fixtures saved November 19, 2026. See docs/sources/tx_ercot_rpg.md.

  - id: tx_ercot_large_load
    state: TX
    name: ERCOT large load reports
    url: https://www.ercot.com/committees/tac/llwg
    layer: context
    method: http
    intended_method: http
    cadence: monthly
    robots_status: allowed
    verified_at: 2026-11-20
    notes: Totals by year and zone, no sites. Context layer. Posted for Large Load Working Group meetings and, as one file among many, for Technical Advisory Committee meetings. Same host and terms as tx_ercot_rpg. See docs/sources/tx_ercot_large_load.md.

  - id: tx_puc_interchange
    state: TX
    name: PUC Interchange filings for transmission certificates
    url: https://interchange.puc.texas.gov
    layer: signal
    method: manual
    intended_method: http
    cadence: daily
    robots_status: restricted
    verified_at: 2026-11-19
    notes: Access is not barred, but the commission's link policy asks for a permission request before content is copied. Held until the owner decides. See docs/sources/tx_puc_interchange.md.

  - id: tx_twdb_well_reports
    state: TX
    name: TWDB submitted drillers reports
    url: https://www.twdb.texas.gov/groundwater/data/data-well-reports.asp
    layer: signal
    method: http
    intended_method: http
    cadence: weekly
    robots_status: allowed
    verified_at: 2026-11-20
    personal_rows: true
    max_body_mb: 300
    notes: One 145 MB file of every well report, rebuilt nightly. The file is not kept. Each run stores an extract of rows in the test counties that are not domestic or stock wells and were submitted in the last two years, without the owner's mailing address or the driller. Approved by the owner on November 20, 2026. See docs/sources/tx_twdb_well_reports.md.

  - id: tx_comptroller_data_centers
    state: TX
    name: Comptroller registered data centers
    url: https://comptroller.texas.gov/taxes/data-centers/data-center-lists.php
    layer: baseline
    method: http
    intended_method: http
    cadence: monthly
    robots_status: allowed
    verified_at: 2026-11-19
    notes: One page with two tables. No county or address field. Robots rules allow /taxes/ and the site says its information is public domain. Fixture saved November 19, 2026. On November 23, 2026 the site answered 403 for robots.txt and the fetcher stored nothing. The owner decides whether to mark the source manual. See docs/sources/tx_comptroller_data_centers.md.

  - id: tx_comptroller_local_agreements
    state: TX
    name: Comptroller local development agreements
    url: https://comptroller.texas.gov/economy/development/search-tools/sb1340/
    layer: signal
    method: manual
    intended_method: http
    cadence: monthly
    robots_status: restricted
    verified_at: 2026-11-20
    notes: The search pages are open, but the data is seven CSV files on assets.comptroller.texas.gov, and that host answers 403 for robots.txt. The fetcher refuses it. Held until the Comptroller answers or the owner decides. Chapter 380 and 381 agreements are reported within 14 days, so part of this feed is not lagging. See docs/sources/tx_comptroller_local_agreements.md.

  - id: tx_comptroller_entity_lookup
    state: TX
    name: Comptroller franchise tax account search
    url: https://comptroller.texas.gov/taxes/franchise/account-status/search
    layer: lookup
    method: manual
    intended_method: http
    cadence: on_demand
    robots_status: allowed
    verified_at: 2026-11-19
    notes: Use the bulk file on data.texas.gov first, then the official API, which needs a key the owner registers for. Never call the /data-search/ address, which robots rules close. See docs/sources/tx_comptroller_entity_lookup.md.

  - id: tx_local_agendas
    state: TX
    name: City and county agendas in the 30 counties
    url: https://rjionline.org/news/welcome-to-agenda-watch/
    layer: signal
    method: manual
    intended_method: http
    cadence: daily
    robots_status: not_checked
    verified_at: null
    notes: Milestone M8. The inventory of 607 public bodies and their platforms is in config/tx_agenda_inventory.csv. The platforms' own rules were read on 2026-11-21. Six restrict a collector, CivicPlus by its terms. Two have a collector, each a source of its own, tx_agendas_legistar and tx_agendas_own_sites. The five county association sites were read on 2026-11-22 and are collected by tx_agendas_own_sites. Eleven smaller outside services were read on 2026-11-22. Seven restrict a collector. Nothing was found against Google Drive, HeyGov, JustMeetings and the Laserfiche portal. The owner cleared HeyGov on 2026-11-22 and two of its four cities are collected by tx_agendas_own_sites. The other three are not cleared. See docs/sources/tx_agenda_platform_terms.md.

  - id: tx_agendas_legistar
    state: TX
    name: Meeting agendas of Texas governments that use Legistar
    url: https://webapi.legistar.com/
    layer: signal
    method: http
    intended_method: http
    cadence: daily
    robots_status: allowed
    verified_at: 2026-11-21
    personal_rows: true
    notes: The Legistar Web API, which the vendor publishes for reading public meeting records. No robots file on it or on any of the 14 governments' Legistar hosts. The hosts that store agenda files bar robots, so only the API is read. Each government is read only if the agenda inventory clears it. Nine of the 14 are cleared. See docs/sources/tx_agendas_legistar.md.

  - id: tx_agendas_own_sites
    state: TX
    name: Meeting agendas that Texas governments post as files on their own websites
    url: https://github.com/th4449/radar/blob/main/config/tx_agenda_inventory.csv
    layer: signal
    method: http
    intended_method: http
    cadence: daily
    robots_status: allowed
    verified_at: 2026-11-21
    personal_rows: true
    notes: Many sites, each with its own robots file and terms. Read on 2026-11-21 for the 76 governments whose inventory rows were confirmed and on 2026-11-22 for the other 38. Of 111 governments 52 are read. 19 are closed by a robots file, their own or their file host's, 10 by their own terms, 7 are on sites CivicPlus builds and are held with its platforms, 3 refused the request and 4 wait on the owner. 16 are not read. The fetcher checks the robots file of every host before every request, and a refusal closes that site for the run. Each government is read only if the agenda inventory clears it. Five counties on the sites the Texas Association of Counties provides were read on 2026-11-22, with no robots file and no terms on any, and are collected too. Three of them keep agendas in a calendar, read through the feed it publishes. Two cities whose files HeyGov keeps, Sandy Oaks and Shallowater, were read on 2026-11-22 and are collected too. 59 governments in all. See docs/sources/tx_agendas_own_sites.md.

  # Michigan statewide feeds.
  - id: mi_mpsc_dockets
    state: MI
    name: Michigan Public Service Commission dockets and orders
    url: https://mi-psc.my.site.com/s/
    layer: signal
    method: manual
    intended_method: manual
    cadence: daily
    robots_status: restricted
    verified_at: 2026-11-19
    notes: E-Dockets robots file allows everything, but the site has no terms of its own and links to the Michigan.gov policies, which bar automated access without a written agreement. News releases are at https://www.michigan.gov/mpsc/commission/news-releases under the same terms. The State refused a written agreement on 2026-11-20. Read by hand, never automated. See docs/sources/mi_mpsc_dockets.md.

  - id: mi_egle_air_pending
    state: MI
    name: EGLE air permits pending decision
    url: https://www.egle.state.mi.us/aps/downloads/permits/PubNotice/NSR_PTIs_Pending_Decision.pdf
    layer: signal
    method: manual
    intended_method: manual
    cadence: daily
    robots_status: restricted
    verified_at: 2026-11-19
    notes: Two PDF lists on a State of Michigan host, one for permits to install and one for general permits. Treated as covered by the Michigan.gov terms, which bar automated access. Request for a written agreement drafted, not sent. See docs/sources/mi_egle_air_pending.md.

  - id: mi_egle_notices
    state: MI
    name: EGLE notices and permit records in the MiEnviro Portal
    url: https://www.michigan.gov/egle/maps-data/mienviroportal
    layer: signal
    method: manual
    intended_method: manual
    cadence: daily
    robots_status: restricted
    verified_at: 2026-11-19
    notes: Michigan.gov terms bar automated access without a written agreement. The portal's public notice search needs no account. Its alerts do. Request for a written agreement drafted, not sent. See docs/sources/mi_egle_notices.md.

  - id: mi_msf_board
    state: MI
    name: Michigan Strategic Fund board packets and data center certificates
    url: https://www.michiganbusiness.org/services/data-center/
    layer: signal
    method: manual
    intended_method: http
    cadence: weekly
    robots_status: not_checked
    verified_at: null
    notes: The board meeting archive still has to be found.

  - id: mi_zoning_notices
    state: MI
    name: Michigan newspaper zoning hearing notices
    url: https://zeus-milenia.legislature.mi.gov/documents/mcl/pdf/mcl-125-3103.pdf
    layer: signal
    method: manual
    intended_method: unknown
    cadence: daily
    robots_status: not_checked
    verified_at: null
    notes: No statewide notice site confirmed yet. Verify first. The URL is the 15 day notice statute.

  # Baselines of known sites and infrastructure.
  - id: us_fractracker
    state: US
    name: FracTracker data centers tracker
    url: https://www.fractracker.org/data-centers
    layer: baseline
    method: manual
    intended_method: manual
    cadence: monthly
    robots_status: restricted
    verified_at: 2026-11-22
    notes: Read again on 2026-11-22. FracTracker's terms now ask for agreement, limit use to what fits its mission and require citation. Esri's terms bar harvesting from the map's service. Nothing is taken by program. Counts taken earlier, no raw data in this repository. The owner agreed to its terms on 2026-11-22 and on 2026-11-23 said to use the data and gave the spreadsheet's address. One sheet was downloaded once that day and is kept outside this repository. It is used to check the backtest's list of known projects. Every public use cites FracTracker Alliance. See docs/sources/us_fractracker.md.

  - id: us_more_than_just_parks
    state: US
    name: More Than Just Parks data center tracker
    url: https://morethanjustparks.com/data-center-tracker/press
    layer: baseline
    method: manual
    intended_method: unknown
    cadence: monthly
    robots_status: not_checked
    verified_at: null
    notes: Terms not yet read.

  - id: mi_wkar_moratoria
    state: MI
    name: WKAR Michigan data center moratorium tracker
    url: https://www.wkar.org/wkar-news/2026-02-27/michigan-data-center-tracker-moratoria-legislation-and-grid-impact
    layer: baseline
    method: manual
    intended_method: manual
    cadence: monthly
    robots_status: not_checked
    verified_at: null
    notes: Journalism. Read by a person and cited, not scraped.

  - id: mi_michigan_advance_roundup
    state: MI
    name: Michigan Advance weekly data center roundup
    url: https://michiganadvance.com/?p=108625
    layer: baseline
    method: manual
    intended_method: manual
    cadence: weekly
    robots_status: not_checked
    verified_at: null
    notes: Journalism. Read by a person and cited, not scraped.

  - id: us_transmission_lines_archive
    state: US
    name: Archived HIFLD transmission lines
    url: https://www.datalumos.org/datalumos/project/240591/version/V1/view
    layer: baseline
    method: manual
    intended_method: manual
    cadence: once
    robots_status: not_checked
    verified_at: null
    notes: A frozen snapshot. Downloaded once by hand if the terms allow.

  - id: tx_parcels
    state: TX
    name: Texas land parcels for the 30 counties
    url: https://www.geographic.texas.gov/stratmap/land-parcels.html
    layer: baseline
    method: manual
    intended_method: manual
    cadence: yearly
    robots_status: not_checked
    verified_at: null
    notes: Updated annually, so ownership lags. Load only the counties in scope.

  # Services the pipeline queries, one record at a time.
  - id: us_census_geocoder
    state: US
    name: Census Bureau geocoder
    url: https://geocoding.geo.census.gov/geocoder/
    layer: lookup
    method: http
    intended_method: http
    cadence: on_demand
    robots_status: allowed
    verified_at: 2026-11-20
    notes: Public service with a documented REST interface. No key, no robots file, no stated request limit. Queried for one address or point at a time, never for a record that names a person. Every answer is archived and reused. See docs/sources/us_census_geocoder.md.
