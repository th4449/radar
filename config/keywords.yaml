# Terms the classifier looks for. See BUILD_PLAN.md section 6.
# The starting list is the one in the build plan, taken from
# https://www.tomsguide.com/ai/7-code-words-that-could-mean-an-ai-data-center-is-coming-to-your-town
#
# A keyword hit is a weak signal. Most light industrial rezonings are warehouses.
# Matching is case-insensitive on whole words.

# Terms that name the thing directly.
direct_terms:
  - data center
  - data centre
  - datacenter

# Terms that often stand in for it. A hit on these alone scores low.
code_words:
  - light industrial
  - data processing
  - technology campus
  - development agreement
  - large load
  - reinvestment zone
  - special land use

# Code words that are not a reason by themselves. One of these gives a signal only when the same
# record uses another term too.
#
# "Special land use" is Michigan's ordinary term for a use that needs a hearing. On November 24,
# 2026 the rules were tried on 56 real Michigan agendas. It was the only reason for a signal
# seven times: a drive-through, a campground, a repair shop, a market. None was about a data
# center. The owner said that day to stop a signal on it alone.
only_with_another_term:
  - special land use

# "Project" followed by a capitalized code name, such as Project Falcon.
# Words in project_stoplist are ordinary phrases, not code names.
project_code_name:
  pattern: '\bProject\s+([A-Z][A-Za-z0-9-]{2,})\b'
  project_stoplist:
    - Manager
    - Management
    - Description
    - Location
    - Number
    - Name
    - Area
    - Site
    - Cost
    - Summary
    - Schedule
    - Status
    - Update
    # Column headings and section titles, seen in a real ERCOT planning file.
    - ISD
    - COD
    - ID
    - Need
    - Needs
    - Generation
    - Capacity
    - Scope
    - Overview
    - Background
    - Costs
    - Details
    - Team
    - Title
    - Type
    - Owner
    - Sponsor
    - Benefits
    - Timeline
    - Purpose
    - Review
    - Evaluation
    - Analysis
    - Study
    - Options
    - Alternatives
    - Recommendation
    - Information
    - Map
    # Seen in real well reports: a public works description, and a company's legal form.
    - Between
    - Intersection
    - Phase
    - Near
    - Along
    - From
    - With
    - And
    - For
    - The
    - LLC
    - Inc
    - LP
    - Ltd
    - Corp
    - Corporation
    - Company
    # Seen in real meeting agendas, where "Project" is followed by an ordinary word.
    - Funding
    - Fund
    - Funds
    - Related
    - Group
    - Updates
    - Community
    - Agreement
    - Plan
    - Plans
    - Budget
    - Report
    - Reports
    - List
    - Limits
    - Design
    - Engineering
    - Construction
    - Completion
    - Closeout
    - Delivery
    - Coordinator
    - Director
    - Engineer
    - Committee
    - Board
    - Fees
    - Total

# A government's own computers. An agenda item can use the words "data center" for the county's
# own server room or its hosting contract. On November 23, 2026 the owner reviewed the 58 sites
# that reached a reviewer in four years of stored agendas: 28 were this, and the owner said to
# set such an item aside.
#
# An item is set aside when it uses one of the words under `shows` and none of the words under
# `unless`. The words under `unless` show land or a project, and they always win: an abatement
# for a data center that offers hosting is a project. Only the words "data center" are set
# aside. Another term in the same item still counts.
#
# Every word here came from a real agenda item. Add one only from a record somebody has read.
own_computers:
  shows:
    - information technology
    - information and technology services
    - technology department
    - co-location
    - colocation
    - network services
    - network technologies
    - network refresh
    - network upgrades
    - data center services
    - data center solution
    - data center refresh
    - data center repair
    - data center ups
    - data center relocation
    - data center cooling
    - data center optimization
    - data center installation
    - air conditioning units
    - managed services
    - cloud services
    - servers
    - data backup
  unless:
    - abatement
    - reinvestment zone
    - rezoning
    - rezone
    - zoning
    - moratorium
    - proposed
    - development agreement
    - special use permit
    - specific use permit
    - site plan
    - annexation
    - megawatt
    - campus
    - economic development
    - incentive
    - town hall
    - townhall
