# Names that are also ordinary words. A record meets one of these only when it gives the name
# alone, with no legal form: "Switch" meets the payer and "Switch LLC" does not, because any
# company can be named Switch LLC. Look at this list again when the study gains a one-word name.
whole_name_only:
  - Switch
  - Meta
  - Oracle
  - Amazon
