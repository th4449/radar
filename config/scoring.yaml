# Points, decay and thresholds. See BUILD_PLAN.md section 8.
#
# Every number here is a placeholder until the backtest in milestone M9 sets the real ones.
# Changing thresholds after the backtest needs the owner's approval (section 11).
#
# Settings that database policies depend on, such as confirmations_required and the admin
# approval gate, are not here. They live in the app_settings table.

placeholder: true

# A signal's points halve every half_life_days.
signal_types:
  abatement_notice:
    weight: high
    points: 30
    half_life_days: 365
  air_permit:
    weight: high
    points: 30
    half_life_days: 365
  transmission_filing:
    weight: high
    points: 30
    half_life_days: 365
  commission_docket:
    weight: high
    points: 30
    half_life_days: 365
  well_report:
    weight: medium
    points: 15
    half_life_days: 365
  stormwater_notice:
    weight: medium
    points: 15
    half_life_days: 365
  entity_land_purchase:
    weight: low
    points: 5
    half_life_days: 365
  agenda_keyword:
    weight: low
    points: 5
    half_life_days: 365

# How sure a signal is, by the rule that produced it. A signal made by several rules takes
# the highest. Placeholders, like every number in this file.
#   direct_term            the record says "data center"
#   listed_company         the named company is on the Comptroller's registered data center
#                          list, under exactly this name
#   listed_company_loose   the same, but with a different legal form: LLC against Inc
#   project_code_name      "Project" and a code name
#   code_word              one of the code words in config/keywords.yaml
confidence:
  direct_term: 0.9
  listed_company: 0.5
  listed_company_loose: 0.3
  project_code_name: 0.3
  code_word: 0.3

# A site gets the bonus when at least min_signal_types independent signal types
# land on it within window_days.
multi_signal_bonus:
  min_signal_types: 2
  window_days: 365
  points: 20

# A site at or above review_threshold goes to the reviewer queue.
thresholds:
  review_threshold: 40
