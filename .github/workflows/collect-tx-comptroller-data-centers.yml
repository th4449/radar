name: Collect tx_comptroller_data_centers

# Texas Comptroller lists of registered data centers.
# Planned cadence: monthly. Started by hand only. The schedule is added at launch, with the
# owner's go-ahead. See docs/sources/tx_comptroller_data_centers.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-tx_comptroller_data_centers
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_comptroller_data_centers
