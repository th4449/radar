name: Collect

# The shared steps for every collector. Each feed has its own small workflow file that calls
# this one with its source id.
#
# Every run is a dry run unless the repository variable RADAR_LIVE is the word true. A dry run
# fetches the source and reports what it found, and keeps nothing.
#
# A real run writes to the hosted database and archive. It needs the owner's go-ahead, which
# the owner gives by setting RADAR_LIVE and the secrets in the repository's settings. No
# commit can switch it on. See docs/launch_checklist.md.

on:
  workflow_call:
    inputs:
      source_id:
        description: The id in config/sources.yaml
        required: true
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # A source that is many sites is asked at the pace each site's robots file sets.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # Tesseract reads scanned PDFs on this runner. Without it a scan is stored unread.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Run the collector
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          # The public contact address sent in the user agent. A repository variable, not a
          # secret. The fetcher refuses to run without it.
          RADAR_CONTACT: ${{ vars.RADAR_CONTACT }}
          RADAR_RUNNER: gha-${{ github.run_id }}
          RADAR_LIVE: ${{ vars.RADAR_LIVE }}
          # Used by a real run only. The address of the hosted project is a variable. The
          # database address and the service key are secrets.
          DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_ARCHIVE_URL: ${{ vars.RADAR_ARCHIVE_URL }}
          RADAR_ARCHIVE_KEY: ${{ secrets.RADAR_ARCHIVE_KEY }}
        run: |
          if [ "$RADAR_LIVE" = "true" ]; then
            uv run python -m collectors.run "$SOURCE_ID"
          else
            echo "Dry run: RADAR_LIVE is not set to true. Nothing is kept."
            uv run python -m collectors.run "$SOURCE_ID" --dry-run
          fi
