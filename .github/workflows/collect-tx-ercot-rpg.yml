name: Collect tx_ercot_rpg

# ERCOT Regional Planning Group meetings and the files posted for them.
# Cadence: weekly.
# Scheduled since November 27, 2026, on the owner's go-ahead. It can still be started by
# hand. See docs/sources/tx_ercot_rpg.md.

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:40 UTC.
    # GitHub may start it some minutes late.
    - cron: "40 10 * * 1"

permissions:
  contents: read

concurrency:
  group: collect-tx_ercot_rpg
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_ercot_rpg
    # A real run reads the database address and the archive key. A dry run uses neither.
    secrets: inherit
