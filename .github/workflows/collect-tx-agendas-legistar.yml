name: Collect tx_agendas_legistar

# Meeting agendas of the Texas governments on Legistar that the agenda inventory clears, read
# through the Legistar Web API. Cadence: daily.
# Scheduled since November 27, 2026, on the owner's go-ahead. It can still be started by
# hand. See docs/sources/tx_agendas_legistar.md.

on:
  workflow_dispatch:
  schedule:
    # Every day at 10:10 UTC, early morning in Texas.
    # GitHub may start it some minutes late.
    - cron: "10 10 * * *"

permissions:
  contents: read

concurrency:
  group: collect-tx_agendas_legistar
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_agendas_legistar
    # A real run reads the database address and the archive key. A dry run uses neither.
    secrets: inherit
