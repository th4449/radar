name: Collect tx_ercot_large_load

# ERCOT's large load reports, posted for two of its committees.
# Cadence: monthly.
# Scheduled since November 27, 2026, on the owner's go-ahead. It can still be started by
# hand. See docs/sources/tx_ercot_large_load.md.

on:
  workflow_dispatch:
  schedule:
    # The 2nd of each month at 11:15 UTC.
    # GitHub may start it some minutes late.
    - cron: "15 11 2 * *"

permissions:
  contents: read

concurrency:
  group: collect-tx_ercot_large_load
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_ercot_large_load
    # A real run reads the database address and the archive key. A dry run uses neither.
    secrets: inherit
