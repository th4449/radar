name: Collect tx_twdb_well_reports

# The Texas Water Development Board's well reports. One 145 MB download. The file is not kept:
# the run stores an extract. Cadence: weekly.
# Scheduled since November 27, 2026, on the owner's go-ahead. It can still be started by
# hand. See docs/sources/tx_twdb_well_reports.md.

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 11:05 UTC.
    # GitHub may start it some minutes late.
    - cron: "5 11 * * 1"

permissions:
  contents: read

concurrency:
  group: collect-tx_twdb_well_reports
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_twdb_well_reports
    # A real run reads the database address and the archive key. A dry run uses neither.
    secrets: inherit
