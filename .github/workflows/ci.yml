name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --no-banner

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Tesseract reads scanned PDFs. It is a program, not a Python package. Apache 2.0.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start local Postgres and apply every migration from scratch
        run: supabase db start

      - name: Test
        env:
          # Policy tests must run in CI. A skipped database test is a failure here.
          RADAR_REQUIRE_DB: "1"
          # The same for the tests that read a scan with Tesseract.
          RADAR_REQUIRE_OCR: "1"
        run: uv run pytest -ra

      # The hosted database holds records. A policy test that passes only on empty tables
      # says nothing about it. This run puts records in first, inside each test's transaction.
      - name: The policy tests again, on a database that already holds records
        env:
          RADAR_REQUIRE_DB: "1"
          RADAR_TEST_RESIDENTS: "1"
        run: >
          uv run pytest -ra
          tests/db/test_policies.py
          tests/db/test_processing_policies.py
          tests/db/test_site_policies.py
          tests/db/test_study_policies.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      # Built with no database address. The pages then say so, and nothing is embedded.
      - name: Build
        run: npm run build

      # The site will be served under a path on another site's domain. Build it that way too
      # and read the result: no address in it may point outside the path.
      - name: Build under a path and check every address stays inside it
        env:
          RADAR_BASE_PATH: /radar
        run: |
          npm run build -- --outDir dist-radar
          node tests/built.ts dist-radar /radar
