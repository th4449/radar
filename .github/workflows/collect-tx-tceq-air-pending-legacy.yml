name: Collect tx_tceq_air_pending_legacy

# TCEQ's two lists of pending air permit applications on its older site.
# Cadence: weekly.
# Scheduled since November 27, 2026, on the owner's go-ahead. It can still be started by
# hand. See docs/sources/tx_tceq_air_pending_legacy.md.

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:50 UTC.
    # GitHub may start it some minutes late.
    - cron: "50 10 * * 1"

permissions:
  contents: read

concurrency:
  group: collect-tx_tceq_air_pending_legacy
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_tceq_air_pending_legacy
    # A real run reads the database address and the archive key. A dry run uses neither.
    secrets: inherit
