name: Collect tx_agendas_own_sites

# Agenda files that Texas governments post on their own websites, for the governments the agenda
# inventory clears. Cadence: daily.
# Scheduled since November 27, 2026, on the owner's go-ahead. It can still be started by
# hand. See docs/sources/tx_agendas_own_sites.md.

on:
  workflow_dispatch:
  schedule:
    # Every day at 10:25 UTC, early morning in Texas.
    # GitHub may start it some minutes late.
    - cron: "25 10 * * *"

permissions:
  contents: read

concurrency:
  group: collect-tx_agendas_own_sites
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_agendas_own_sites
    # A real run reads the database address and the archive key. A dry run uses neither.
    secrets: inherit
