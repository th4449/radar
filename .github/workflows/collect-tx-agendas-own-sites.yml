name: Collect tx_agendas_own_sites

# Agenda files that Texas governments post on their own websites, for the governments the agenda
# inventory clears. Planned cadence: daily. Started by hand only. The schedule is added at
# launch, with the owner's go-ahead. See docs/sources/tx_agendas_own_sites.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-tx_agendas_own_sites
  cancel-in-progress: false

jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      source_id: tx_agendas_own_sites
